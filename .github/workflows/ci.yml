name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
      - "feat/**"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Quality budget
        run: pnpm quality:budget

      - name: Validate ALINA shell contract
        run: pnpm validate:alina-shell

      - name: Install Chromium
        run: pnpm --filter @father/alina-control-center exec playwright install --with-deps chromium

      - name: Visual QA
        run: pnpm --filter @father/alina-control-center test:visual

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alina-visual-evidence
          path: |
            apps/alina-control-center/test-results
            reports/quality-budget-report.json
          if-no-files-found: warn
